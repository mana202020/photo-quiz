<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>読み込み中...</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body, html {
    width: 100%;
    height: 100%;
    background-color: #000;
    overflow: hidden;
    position: relative;
  }
  /* 1枚目（背景）の画像 */
  .bg-img {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    display: block;
  }
  /* 2枚目（ポップアップ）の画像 */
  .popup-img {
    display: none; /* 最初は非表示 */
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%); /* 画面のド真ん中に配置 */
    width: 80vw;
    max-width: 600px;
    border: 3px solid #fff; /* 白い枠線 */
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    z-index: 999;
  }
</style>
</head>
<body>

  <!-- 1枚目（背景画像） -->
  <img src="target.jpg" class="bg-img" alt="">

  <!-- 2枚目（ポップアップ画像） -->
  <img src="target2.jpg" id="popup" class="popup-img" alt="">

  <script>
    // 3000ミリ秒（3秒）後にポップアップを表示
    setTimeout(() => {
      document.getElementById('popup').style.display = 'block';
    }, 3000); 
    // ※ 1秒後にしたい場合は 1000 に変更してください
  </script>

</body>
</html>
