<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>読み込み中...</title>
<!-- 血文字風のホラーフォントを読み込み -->
<link href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body, html {
    width: 100%;
    height: 100%;
    background-color: #000;
    overflow: hidden;
    position: relative;
  }
  /* 1枚目（背景）の画像 */
  .bg-img {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    display: block;
  }
  /* 2枚目（ポップアップ）の画像 */
  .popup-img {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80vw;
    max-width: 600px;
    border: 3px solid #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    z-index: 999;
  }
  /* 血文字のカウントダウン */
  #countdown {
    position: absolute;
    top: 5%; /* 画面上部 */
    width: 100%;
    text-align: center;
    font-family: 'Nosifer', cursive; /* ホラーフォント指定 */
    font-size: 80px;
    color: #990000; /* 赤黒い血の色 */
    text-shadow: 2px 2px 10px #000; /* 黒い影をつけて目立たせる */
    z-index: 1000;
  }
</style>
</head>
<body>

  <!-- 血文字のカウントダウン表示 -->
  <div id="countdown">3</div>

  <!-- 1枚目（背景画像） -->
  <img src="target.jpg" class="bg-img" alt="">

  <!-- 2枚目（ポップアップ画像） -->
  <img src="target2.jpg" id="popup" class="popup-img" alt="">

  <script>
    let timeLeft = 3; // カウントダウンの秒数（3秒）
    const countElement = document.getElementById('countdown');
    const popupElement = document.getElementById('popup');

    // 1秒（1000ミリ秒）ごとに処理を実行
    const timer = setInterval(() => {
      timeLeft--;
      
      if (timeLeft > 0) {
        // カウントを減らして画面を更新
        countElement.textContent = timeLeft;
      } else {
        // 0になったときの処理
        clearInterval(timer); // タイマー停止
        countElement.style.display = 'none'; // カウントダウンの数字を消す
        popupElement.style.display = 'block'; // ポップアップ画像を表示
      }
    }, 1000);
  </script>

</body>
</html>
