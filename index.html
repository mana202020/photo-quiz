<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- SNSでリンクを共有した際に表示される偽装タイトルと説明文 -->
<meta property="og:title" content="【衝撃】この写真の違和感に気づけますか？">
<meta property="og:description" content="画像の中央をよく見てください。">
<title>読み込み中...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html {
    width: 100%; height: 100%; background: #000;
    overflow: hidden; display: flex; justify-content: center; align-items: center;
  }
  #btn {
    padding: 18px 36px; font-size: 20px; font-weight: bold;
    cursor: pointer; background: #fff; border: 2px solid #ccc; border-radius: 8px;
  }
  #img {
    display: none; width: 100vw; height: 100vh; object-fit: cover;
  }
</style>
</head>
<body>

  <button id="btn">ここをタップして確認</button>
  <img id="img" src="target.jpg" alt="">

  <script>
    const btn = document.getElementById('btn');
    const img = document.getElementById('img');

    btn.addEventListener('click', () => {
      // 全画面化
      const doc = document.documentElement;
      if (doc.requestFullscreen) doc.requestFullscreen();
      else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();

      // 画像表示
      btn.style.display = 'none';
      img.style.display = 'block';
    });
  </script>
</body>
</html>
