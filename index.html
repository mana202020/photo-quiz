<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>読み込み中...</title>
<!-- 血文字系のホラーフォント（Creepster）を読み込み -->
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body, html {
    width: 100%;
    height: 100%;
    background-color: #000;
    overflow: hidden;
    position: relative;
  }
  .bg-img {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    display: block;
  }
  .popup-img {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80vw;
    max-width: 600px;
    border: 3px solid #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    z-index: 999;
  }
  
  /* カウントダウン：真っ赤＆画面ド真ん中配置 */
  #countdown {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%); /* 画面の完全な中央に配置 */
    font-family: 'Creepster', cursive, sans-serif; /* ホラーフォント指定（失敗時はsans-serif） */
    font-size: 150px; /* 文字を巨大化 */
    color: #ff0000; /* 真っ赤 */
    text-shadow: 
      0 0 10px #ff0000, 
      0 0 20px #8b0000, 
      5px 5px 15px #000; /* 発光するような血の影 */
    z-index: 1000;
    /* フォント読み込み完了まで一瞬非表示にする（チラつき防止） */
    opacity: 0; 
    animation: fadeIn 0.5s forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }
</style>
</head>
<body>

  <div id="countdown">3</div>
  <img src="target.jpg" class="bg-img" alt="">
  <img src="target2.jpg" id="popup" class="popup-img" alt="">

  <script>
    let timeLeft = 3;
    const countElement = document.getElementById('countdown');
    const popupElement = document.getElementById('popup');

    const timer = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        countElement.textContent = timeLeft;
      } else {
        clearInterval(timer);
        countElement.style.display = 'none';
        popupElement.style.display = 'block';
      }
    }, 1000);
  </script>

</body>
</html>
